<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SahelPay</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f2fa;
  color: #252044;
}
header {
  background: #6336a0;
  color: white;
  padding: 25px;
  text-align: center;
}
main {
  padding: 20px;
}
.balance {
  background: #6336a0;
  color: white;
  padding: 25px;
  border-radius: 18px;
  margin: 20px 0;
}
.services {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}
.service {
  background: white;
  padding: 25px 10px;
  border-radius: 15px;
  text-align: center;
}
</style>
</head>
<body>
<header>
  <h1>SahelPay</h1>
  <p>Votre portefeuille numérique</p>
</header>
<main>
  <div class="balance">
    <p>Solde de démonstration</p>
    <h1>25 000 FCFA</h1>
    <small>Montant fictif</small>
  </div>
  <h2>Nos services</h2>
  <div class="services">
    <div class="service">💳<p>Portefeuille</p></div>
    <div class="service">💸<p>Transferts</p></div>
    <div class="service">📱<p>Mobile Money</p></div>
    <div class="service">₿<p>Crypto</p></div>
  </div>
</main>
</body>
</html>
