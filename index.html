<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SahelPay</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f2fa;
  color: #252044;
}
header {
  background: #6336a0;
  color: white;
  padding: 25px;
  text-align: center;
}
main {
  padding: 20px;
}
.balance {
  background: #6336a0;
  color: white;
  padding: 25px;
  border-radius: 18px;
  margin: 20px 0;
}
.services {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}
.service {
  background: white;
  padding: 25px 10px;
  border-radius: 15px;
  text-align: center;
}
</style>
</head>
<body>
<header>
  <h1>SahelPay</h1>
  <p>Votre portefeuille numérique</p>
</header>
<main>
  <div class="balance">
    <p>Solde de démonstration</p>
    <h1>25 000 FCFA</h1>
    <small>Montant fictif</small>
  </div>
  <h2>Nos services</h2>
  <div class="services">
    <div class="service">💳<p>Portefeuille</p></div>
    <div class="service">💸<p>Transferts</p></div>
    <div class="service">📱<p>Mobile Money</p></div>
    <div class="service">₿<p>Crypto</p></div>
  </div>
</main>
  
<section style="background:white;padding:20px;border-radius:15px;margin:20px 0;">
  <h2>💸 Envoyer de l'argent</h2>
  <p>Effectuer un transfert SahelPay</p>

  <label>Nom du bénéficiaire</label>
  <input id="beneficiaire" type="text" placeholder="Nom du destinataire" style="width:100%;padding:12px;box-sizing:border-box;margin:10px 0;">

  <label>Numéro du destinataire</label>
  <input id="numero" type="tel" placeholder="Numéro de téléphone" style="width:100%;padding:12px;box-sizing:border-box;margin:10px 0;">

  <label>Montant en FCFA</label>
  <input id="montant" type="number" placeholder="Exemple : 10000" min="1" style="width:100%;padding:12px;box-sizing:border-box;margin:10px 0;">

  <p>Commission SahelPay : 1 %</p>
  <p id="commission">Commission : 0 FCFA</p>
  <p id="total">Total à payer : 0 FCFA</p>

  <button onclick="
    const m = Number(document.getElementById('montant').value);
    const n = document.getElementById('beneficiaire').value.trim();
    const p = document.getElementById('numero').value.trim();
    if(!n || !p || !Number.isFinite(m) || m <= 0) {
      alert('Veuillez remplir correctement les champs.');
    } else {
      const c = Math.round(m * 0.01);
      document.getElementById('commission').textContent = 'Commission : ' + c.toLocaleString('fr-FR') + ' FCFA';
      document.getElementById('total').textContent = 'Total à payer : ' + (m+c).toLocaleString('fr-FR') + ' FCFA';
      alert('Simulation uniquement. Aucun argent ne sera transféré.');
    }
  " style="background:#6336a0;color:white;padding:15px;width:100%;border:0;border-radius:10px;">
    Calculer mon transfert
  </button>
</section>

</body>
</html>
